<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | L.C Digital Solution</title>
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .nf-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
  .nf-code{font-family:var(--font-display);font-size:clamp(5rem,18vw,9rem);font-weight:700;line-height:1;
    background:linear-gradient(120deg,var(--primary-2),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .nf-sub{font-family:var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--text-lo);margin:10px 0 18px}
  .nf-text{color:var(--text-lo);max-width:420px;margin-bottom:28px}
</style>
</head>
<body>
  <div class="nf-wrap">
    <img src="assets/logo.png" alt="L.C Digital Solution" style="height:46px;margin-bottom:24px">
    <div class="nf-code">404</div>
    <div class="nf-sub">Page not found</div>
    <p class="nf-text">The page you're looking for has moved, or never existed. Let's get you back on track.</p>
    <a href="index.html" class="btn btn-primary"><i class="fas fa-arrow-left"></i> Back to Home</a>
  </div>
</body>
</html>
